name: Android (Google Play)

on:
  push:
    branches: [claude/clever-gates-gjwcdl, main]
    paths: ['demo/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Upload key (only when the secrets exist; without them the AAB is unsigned and the APKs use a debug key)
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ZNAKEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ZNAKEX_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build AAB (Play) and APKs
        working-directory: demo/play
        env:
          ZNAKEX_KEYSTORE_PASSWORD: ${{ secrets.ZNAKEX_KEYSTORE_PASSWORD }}
          ZNAKEX_KEY_ALIAS: ${{ secrets.ZNAKEX_KEY_ALIAS }}
          ZNAKEX_KEY_PASSWORD: ${{ secrets.ZNAKEX_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          GAMES_PROJECT_ID: ${{ secrets.GAMES_PROJECT_ID }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          LB_CLASSIC: ${{ secrets.LB_CLASSIC }}
          LB_FRENZY: ${{ secrets.LB_FRENZY }}
        run: |
          ARGS=""
          [ -n "$ADMOB_APP_ID" ] && ARGS="$ARGS -PadmobAppId=$ADMOB_APP_ID"
          [ -n "$GAMES_PROJECT_ID" ] && ARGS="$ARGS -PgamesProjectId=$GAMES_PROJECT_ID"
          [ -n "$ADMOB_INTERSTITIAL" ] && ARGS="$ARGS -PadmobInterstitial=$ADMOB_INTERSTITIAL"
          [ -n "$ADMOB_REWARDED" ] && ARGS="$ARGS -PadmobRewarded=$ADMOB_REWARDED"
          [ -n "$LB_CLASSIC" ] && ARGS="$ARGS -PlbClassic=$LB_CLASSIC"
          [ -n "$LB_FRENZY" ] && ARGS="$ARGS -PlbFrenzy=$LB_FRENZY"
          gradle --no-daemon $ARGS bundlePlayRelease assemblePlayRelease assembleBetaRelease

      - uses: actions/upload-artifact@v4
        with:
          name: znakex-play
          path: |
            demo/play/app/build/outputs/bundle/playRelease/*.aab
            demo/play/app/build/outputs/apk/play/release/*.apk
            demo/play/app/build/outputs/apk/beta/release/*.apk
          if-no-files-found: error
